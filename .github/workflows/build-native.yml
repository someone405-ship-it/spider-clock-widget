name: Build APK and EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npx electron-builder --win portable --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClock-Windows-EXE
          path: dist-native/*.exe
          if-no-files-found: error
          retention-days: 30

  build-android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo -e "24333f8a63b6825ea9c5514fde33152b49f652d2\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          echo -e "d56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          yes 2>/dev/null | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install npm deps
        run: npm install

      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www
          cp index.html style.css script.js manifest.json sw.js www/
          # Capacitor webDir must not be repo root (avoids copying node_modules)
          python3 -c "
          import json
          c=json.load(open('capacitor.config.json'))
          c['webDir']='www'
          json.dump(c, open('capacitor.config.json','w'), indent=2)
          print(c)
          "

      - name: Add Capacitor Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK
        run: |
          mkdir -p dist-native
          find android -name "*.apk" -type f -print
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-native/SpiderClock-Android.apk
          ls -la dist-native/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClock-Android-APK
          path: dist-native/SpiderClock-Android.apk
          if-no-files-found: error
          retention-days: 30
