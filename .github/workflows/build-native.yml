name: Build APK and EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Vendor GSAP + inject original gear ticks into index
        shell: bash
        run: |
          curl -fsSL "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" -o gsap.min.js
          if ! grep -q gear-original.js index.html; then
            sed -i 's#</body>#<script src="./gear-original.js"></script>\n</body>#' index.html || sed -i '' 's#</body>#<script src="./gear-original.js"></script>\n</body>#' index.html
          fi
          # Prefer local GSAP in packaged app
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js#./gsap.min.js#g' index.html || true
          sed -i '/MorphSVGPlugin/d' index.html || true
      - name: Build portable EXE
        run: npx electron-builder --win portable --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist-native/*.exe
          if-no-files-found: error
          retention-days: 30

  build-android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/tmp/licenses.txt || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - run: npm install

      - name: Prepare www — original SVG + original gear ticks
        run: |
          set -e
          mkdir -p www
          cp index.html style.css script.js manifest.json sw.js mobile-bridge.js gear-original.js www/
          curl -fsSL "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" -o www/gsap.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js#./gsap.min.js#g' www/index.html
          sed -i '/MorphSVGPlugin/d' www/index.html
          if ! grep -q mobile-bridge.js www/index.html; then
            sed -i 's#</body>#<script src="./mobile-bridge.js"></script>\n</body>#' www/index.html
          fi
          if ! grep -q gear-original.js www/index.html; then
            sed -i 's#</body>#<script src="./gear-original.js"></script>\n</body>#' www/index.html
          fi
          ls -la www/

      - name: Capacitor Android + live original clock widget
        run: |
          npx cap add android
          npx cap sync android
          chmod +x android-widget/inject-widget.sh
          bash android-widget/inject-widget.sh
          if ! grep -q android.permission.INTERNET android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<application#    <uses-permission android:name="android.permission.INTERNET" />\n    <application#' android/app/src/main/AndroidManifest.xml
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist-native
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-native/SpiderClock-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-native/SpiderClock-Android.apk
          if-no-files-found: error
          retention-days: 30

  combine:
    name: One zip with EXE + APK
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: bundle
      - name: Pack both
        run: |
          cd bundle
          for f in *.exe; do [ -f "$f" ] && mv "$f" SpiderClock-Windows.exe || true; done
          for f in *.apk; do [ -f "$f" ] && mv "$f" SpiderClock-Android.apk || true; done
          test -f SpiderClock-Windows.exe && test -f SpiderClock-Android.apk
          zip -r ../SpiderClock-Windows-and-Android.zip SpiderClock-Windows.exe SpiderClock-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpiderClock-Windows-and-Android
          path: SpiderClock-Windows-and-Android.zip
          if-no-files-found: error
          retention-days: 30
