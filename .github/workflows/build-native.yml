name: Build APK and EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npx electron-builder --win portable --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClock-Windows-EXE
          path: dist-native/*.exe
          if-no-files-found: error
          retention-days: 30

  build-android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        run: npm install

      - name: Add Capacitor Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK
        run: |
          mkdir -p dist-native
          find android -name "*.apk" -type f -print
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-native/SpiderClock-Android.apk
          ls -la dist-native/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClock-Android-APK
          path: dist-native/SpiderClock-Android.apk
          if-no-files-found: error
          retention-days: 30
