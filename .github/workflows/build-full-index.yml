name: Build Full Spider Clock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original SVG source
        run: curl -fsSL https://raw.githubusercontent.com/piyush-soni777/ps-spider-clock/main/index.html -o original.html

      - name: Build index.html
        run: |
          python3 -c "
          import re
          html = open('original.html').read()
          head = '''<head>
          <meta charset=UTF-8>
          <meta name=viewport content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\">
          <meta name=theme-color content=\"#a34a01\">
          <meta name=mobile-web-app-capable content=yes>
          <meta name=apple-mobile-web-app-capable content=yes>
          <link rel=manifest href=manifest.json>
          <title>Spider Clock Widget</title>
          <link rel=stylesheet href=./style.css>
          </head>'''
          html = re.sub(r'<head>.*?</head>', head, html, flags=re.S)
          html = html.replace('flood-color=\"#a0a0a0\"', 'flood-color=\"#a34a01\"')
          scripts = '''<script src=https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js></script>
          <script src=https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MorphSVGPlugin.min.js></script>
          <script src=./script.js></script>
          <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}</script>
          </body>'''
          html = re.sub(r'<script[^>]*>.*?</script>', '', html, flags=re.S|re.I)
          html = html.replace('</body>', scripts)
          open('index.html','w').write(html)
          print('OK', len(html), 'face01' in html)
          "

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --staged --quiet || git commit -m "chore: rebuild full index.html"
          git push
