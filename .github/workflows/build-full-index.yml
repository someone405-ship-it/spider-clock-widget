name: Build Full Spider Clock

on:
  workflow_dispatch:
  push:
    paths:
      - "style.css"
      - "script.js"
      - "manifest.json"
      - "sw.js"
      - ".github/workflows/build-full-index.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original full index.html
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/piyush-soni777/ps-spider-clock/main/index.html" -o original.html
          echo "Downloaded size: $(wc -c < original.html)"
          test -s original.html

      - name: Patch into complete production index.html
        run: |
          python3 << 'PY'
          import re, sys
          with open("original.html") as f:
              html = f.read()
          if "face01" not in html:
              print("ERROR: source missing face01")
              sys.exit(1)
          new_head = """<head>
    <meta charset=\"UTF-8\">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">
    <meta name=\"description\" content=\"Spider Clock Widget\">
    <meta name=\"theme-color\" content=\"#a34a01\">
    <meta name=\"mobile-web-app-capable\" content=\"yes\">
    <meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
    <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">
    <meta name=\"apple-mobile-web-app-title\" content=\"Spider Clock\">
    <link rel=\"manifest\" href=\"manifest.json\">
    <title>Spider Clock Widget</title>
    <link rel=\"stylesheet\" href=\"./style.css\">
</head>"""
          html = re.sub(r"<head>.*?</head>", new_head, html, flags=re.DOTALL)
          html = html.replace('flood-color=\"#a0a0a0\"', 'flood-color=\"#a34a01\"')
          new_scripts = """
    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js\"></script>
    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MorphSVGPlugin.min.js\"></script>
    <script src=\"./script.js\"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW reg failed', e));
        });
      }
    </script>"""
          html = re.sub(r"<script[^>]*gsap[^>]*>.*?</script>\\s*", "", html, flags=re.DOTALL | re.IGNORECASE)
          html = re.sub(r"<script[^>]*MorphSVG[^>]*>.*?</script>\\s*", "", html, flags=re.DOTALL | re.IGNORECASE)
          html = re.sub(r"<script[^>]*src=[\"']\\./script\\.js[\"'][^>]*>.*?</script>\\s*", "", html, flags=re.DOTALL | re.IGNORECASE)
          html = html.replace("</body>", new_scripts + "\\n</body>")
          with open("index.html", "w") as f:
              f.write(html)
          print("Patched size:", len(html))
          print("face01:", "face01" in html)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: rebuild full Spider Clock index.html [skip ci]"
            git push
          fi
