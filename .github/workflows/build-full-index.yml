name: Build Full Spider Clock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original source
        run: |
          curl -fsSL https://raw.githubusercontent.com/piyush-soni777/ps-spider-clock/main/index.html -o original.html
          echo "Downloaded $(wc -c < original.html) bytes"

      - name: Build production index.html
        run: |
          python3 << 'EOF'
          import re
          import sys

          with open("original.html", encoding="utf-8") as f:
              html = f.read()

          if "face01" not in html:
              print("ERROR: source missing spider paths")
              sys.exit(1)

          head = """<head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
              <meta name="description" content="Spider Clock Widget">
              <meta name="theme-color" content="#a34a01">
              <meta name="mobile-web-app-capable" content="yes">
              <meta name="apple-mobile-web-app-capable" content="yes">
              <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
              <meta name="apple-mobile-web-app-title" content="Spider Clock">
              <link rel="manifest" href="manifest.json">
              <title>Spider Clock Widget</title>
              <link rel="stylesheet" href="./style.css">
          </head>"""

          html = re.sub(r"<head>.*?</head>", head, html, flags=re.DOTALL)
          html = html.replace('flood-color="#a0a0a0"', 'flood-color="#a34a01"')
          html = re.sub(r"<script[^>]*>.*?</script>", "", html, flags=re.DOTALL | re.IGNORECASE)

          scripts = """
              <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
              <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MorphSVGPlugin.min.js"></script>
              <script src="./script.js"></script>
              <script>
                if ('serviceWorker' in navigator) {
                  window.addEventListener('load', function () {
                    navigator.serviceWorker.register('./sw.js').catch(function (e) {
                      console.log('SW reg failed', e);
                    });
                  });
                }
              </script>
          </body>"""

          if "</body>" not in html:
              print("ERROR: no </body>")
              sys.exit(1)

          html = html.replace("</body>", scripts)

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("Built index.html:", len(html), "bytes")
          print("Has face01:", "face01" in html)
          print("Has watchSVG:", "watchSVG" in html)
          EOF

      - name: Pack download zip
        run: |
          mkdir -p dist
          cp index.html style.css script.js manifest.json sw.js dist/
          cd dist && zip -r ../spider-clock-widget.zip .
          ls -la ../spider-clock-widget.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spider-clock-widget
          path: spider-clock-widget.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rebuild full Spider Clock index.html"
            git push
          fi
